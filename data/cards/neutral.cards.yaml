# Placeholder content for ADR 0009 phase B. Ids are opaque and never shown; every name is a TODO
# for a human writer (data/i18n/<locale>/cards.yaml). Mechanics only — see docs/protocol/cards.md.
# data/ uses only the words the phase-B engine acts on; leaders' activated abilities wait for C.
schema: opengwt.cards/2
faction: neutral

cards:
  u-0001:
    kind: unit
    color: bronze
    provisions: 4
    power: 6

  # nothing can be added to it
  u-0002:
    kind: unit
    color: bronze
    provisions: 5
    power: 5
    armor: 1
    statuses: [status_proof]

  # strong, and gone for good when it leaves the board
  u-0003:
    kind: unit
    color: gold
    provisions: 7
    power: 9
    statuses: [banish_on_leave]

  u-0004:
    kind: unit
    color: bronze
    provisions: 4
    power: 4
    abilities:
      - when: on_play
        do: reset_power
        target: { units: chosen, side: both, where: { boosted: true } }

  # punishes the opponent's units that landed on this side
  u-0005:
    kind: unit
    color: bronze
    provisions: 4
    power: 4
    abilities:
      - when: on_play
        do: damage
        amount: 2
        target: { units: all, side: self, where: { statuses_any: [on_enemy_side] } }

  s-0001:
    kind: special
    color: gold
    provisions: 6
    abilities:
      - when: on_play
        do: discard
        cards: { pick: random, count: 2 }
      - when: on_play
        do: draw
        count: 2

  s-0002:
    kind: special
    color: bronze
    provisions: 4
    abilities:
      - when: on_play
        do: clear_row_effect
        row_target: { pick: all, side: both }

  s-0003:
    kind: special
    color: gold
    provisions: 9
    abilities:
      - when: on_play
        do: destroy
        target: { units: strongest, side: both }

  s-0004:
    kind: special
    color: bronze
    provisions: 5
    abilities:
      - when: on_play
        do: banish
        target: { units: chosen, side: both, where: { statuses_any: [locked] } }
