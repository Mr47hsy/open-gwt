# Placeholder content for ADR 0009 phases B and C. Ids are opaque and never shown; every name is a
# TODO for a human writer (data/i18n/<locale>/cards.yaml). Mechanics only — see
# docs/protocol/cards.md.
schema: opengwt.cards/2
faction: neutral

cards:
  u-0001:
    kind: unit
    color: bronze
    provisions: 4
    power: 6

  # nothing can be added to it
  u-0002:
    kind: unit
    color: bronze
    provisions: 4
    power: 5
    armor: 1
    statuses: [status_proof]

  # strong, and gone for good when it leaves the board
  u-0003:
    kind: unit
    color: gold
    provisions: 7
    power: 9
    statuses: [banish_on_leave]

  u-0004:
    kind: unit
    color: bronze
    provisions: 4
    power: 4
    abilities:
      - when: on_play
        do: reset_power
        target: { units: chosen, side: both, where: { boosted: true } }

  # punishes the opponent's units that landed on this side
  u-0005:
    kind: unit
    color: bronze
    provisions: 4
    power: 4
    abilities:
      - when: on_play
        do: damage
        amount: 2
        target: { units: all, side: self, where: { statuses_any: [on_enemy_side] } }

  # when destroyed, the next copy steps from the deck onto the row it was on
  u-0006:
    kind: unit
    color: bronze
    provisions: 4
    power: 3
    abilities:
      - when: on_destroyed
        do: summon_from_deck
        cards: { pick: first, where: { same_id_as_this: true } }

  # a token some stratagems place
  t-0001:
    kind: unit
    token: true
    power: 2

  # stratagems (ADR 0011): the player who goes first starts with theirs on the board, taking a
  # place on its row; each is used once and then banished
  g-0001:
    kind: stratagem
    abilities:
      - when: on_activate
        do: boost
        amount: 3
        target: { units: chosen, side: self }

  g-0002:
    kind: stratagem
    rows: [ranged]
    abilities:
      - when: on_activate
        do: place_new_card
        card: t-0001
        count: 2

  g-0003:
    kind: stratagem
    abilities:
      - when: on_activate
        do: draw
        count: 1

  s-0001:
    kind: special
    color: gold
    provisions: 6
    abilities:
      - when: on_play
        do: discard
        cards: { pick: random, count: 2 }
      - when: on_play
        do: draw
        count: 2

  s-0002:
    kind: special
    color: bronze
    provisions: 4
    abilities:
      - when: on_play
        do: clear_row_effect
        row_target: { pick: all, side: both }

  s-0003:
    kind: special
    color: gold
    provisions: 9
    abilities:
      - when: on_play
        do: destroy
        target: { units: strongest, side: both }

  s-0004:
    kind: special
    color: bronze
    provisions: 5
    abilities:
      - when: on_play
        do: banish
        target: { units: chosen, side: both, where: { statuses_any: [locked] } }
