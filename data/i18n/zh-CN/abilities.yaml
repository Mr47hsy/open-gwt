# 卡面文案模板（docs/protocol/i18n.md §10）。某张卡在本语言没有显式文案时，编译器用这些模板
# 生成 `card.<id>.text`；显式文案永远优先。每个能力由其动作模板生成一句话，句中的
# `{target}`、`{rows}`、`{cards}`、`{from}`、`{place}`、`{filter}` 先由下面的键渲染，再原样插入。
# `{count}` 总是句子所计数的那个数字。

# --- 连接短语与句子
ability.join.sentences: "{a}{b}"
ability.join.list: "{a}、{b}"
ability.join.or: "{a}或{b}"
ability.join.and: "{a}和{b}"
ability.if.and: "{a}且{b}"

# --- 卡牌本身（写在能力之前）
ability.card.row-only.melee: 只能打出在近战行。
ability.card.row-only.ranged: 只能打出在远程行。
ability.card.stratagem-row.melee: 开局位于近战行。
ability.card.stratagem-row.ranged: 开局位于远程行。
ability.card.opponent-side: 登场于对手一方。
ability.card.armor: "护甲{count}。"
ability.card.provision-bonus: "构筑预算增加{count}。"
ability.card.status.shielded: 登场时带有护盾。
ability.card.status.immune: 免疫：不会作为选择目标出现。
ability.card.status.banish-on-leave: 离开战场时被放逐。
ability.card.status.kept-at-round-end: 本局结束时留在战场上，仅一次。
ability.card.status.status-proof: 无法被添加任何状态。
ability.card.status.guarding: 守护：对手无法选择其所在行的其他牌。

# --- 主动能力：{count} 为次数；次数无限时为冷却回合数
ability.activate.charges: "主动能力（{count}次）：{effect}"
