# 状态与行效果（cards.md §9、§10）：玩家看到的词汇名称。
status.locked.name: 锁定
status.locked.text: 被锁定时它的能力全部失效。
status.shielded.name: 护盾
status.shielded.text: 挡下它将受到的下一次伤害，随后护盾消失。
status.immune.name: 免疫
status.immune.text: 不能被选为目标；不需要指定目标的效果仍会影响它。
status.poisoned.name: 中毒
status.poisoned.text: 再次中毒时被消灭。
status.bleeding.name: 流血
status.bleeding.text: 控制者每个回合结束时受到 1 点无视护甲的伤害。
status.growing.name: 成长
status.growing.text: 控制者每个回合结束时增益 1。
status.banish-on-leave.name: 离场即放逐
status.banish-on-leave.text: 离开战场时会被放逐，而不是去往其他地方。
status.kept-at-round-end.name: 局末保留
status.kept-at-round-end.text: 本局结束时留在战场上，仅一次。
status.status-proof.name: 状态免疫
status.status-proof.text: 无法被添加任何状态。
status.guarding.name: 守护
status.guarding.text: 它在某一行时，对手不能选择该行的其他牌。
status.on-enemy-side.name: 在敌方一侧
status.on-enemy-side.text: 它站在不拥有它的玩家那一侧。
row-effect.damage-strongest.name: 最强单位受伤
row-effect.damage-strongest.text: "该玩家每个回合开始时，本行最强的单位受到 {amount} 点伤害。"
row-effect.damage-weakest.name: 最弱单位受伤
row-effect.damage-weakest.text: "该玩家每个回合开始时，本行最弱的单位受到 {amount} 点伤害。"
row-effect.damage-random.name: 随机受伤
row-effect.damage-random.text.other: "该玩家每个回合开始时，本行随机 {count} 个单位受到 {amount} 点伤害。"
row-effect.boost-random.name: 随机增益
row-effect.boost-random.text.other: "该玩家每个回合开始时，本行随机 {count} 个单位增益 {amount}。"
row-effect.damage-on-arrival.name: 入场受伤
row-effect.damage-on-arrival.text: "进入本行的单位受到 {amount} 点伤害。"

