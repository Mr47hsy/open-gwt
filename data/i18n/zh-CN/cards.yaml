card.u-1007.text: 单位，战力 5。打出于近战行时：获得 2 点护甲；打出于远程行时：对 2 个随机敌方单位各造成 1 点伤害。
card.u-1008.name: 占位 A 单位 8
card.u-1008.text: 单位，战力 3。打出时：在你之后 3 个回合结束时各获得 1 点增益。
