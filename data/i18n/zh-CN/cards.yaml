card.u-1015.name: 占位 A 单位 15
card.u-1015.text: 单位，战力 5。打出时：若你的手牌不多于 3 张，获得 4 点增益。
card.u-1016.name: 占位 A 单位 16
card.u-1016.text: 单位，战力 4。打出时：若你的初始牌库中没有中立卡，获得 2 点增益。
card.u-2001.name: 占位 B 单位 1
card.u-2001.text: 单位，战力 5。
