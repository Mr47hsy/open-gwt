card.u-2006.text: 单位，战力 4。打出时：对每个流血的敌方单位造成 1 点伤害。
card.u-2007.name: 占位 B 单位 7
card.u-2007.text: 单位，战力 3。打出时：锁定一个敌方单位或器物。
card.u-2008.name: 占位 B 单位 8
card.u-2008.text: 单位，战力 5。打出时：若至少 2 个敌方单位受伤，对战力最高的敌方单位造成 3 点伤害。
