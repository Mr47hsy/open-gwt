card.a-1001.name: 占位 A 器物 1
card.a-1001.text: 器物，远程行。在场时：同一行的单位战力 +1。
card.a-2001.name: 占位 B 器物 1
card.a-2001.text: 器物，近战行。无法被选为目标。局结束时：对一个随机敌方单位造成 2 点伤害。
card.g-0001.name: 占位 N 计策 1
card.g-0001.text: 计策。若你先手，开局时位于你的战场上。仅一次：使一个己方单位获得 3 点增益。
card.g-0002.name: 占位 N 计策 2
card.g-0002.text: 计策，远程行。若你先手，开局时位于你的战场上。仅一次：在其旁边放置 2 张占位 N 衍生卡 1。
card.g-0003.name: 占位 N 计策 3
card.g-0003.text: 计策。若你先手，开局时位于你的战场上。仅一次：抽 1 张牌。
card.l-1001.name: 占位 A 领袖 1
card.l-1001.text: 领袖。构筑预算 +15。2 次：使一个己方单位获得 2 点增益。
card.l-2001.name: 占位 B 领袖 1
card.l-2001.text: 领袖。构筑预算 +15。1 次：对一个敌方单位造成 3 点伤害。
card.s-0001.name: 占位 N 特殊牌 1
card.s-0001.text: 随机弃掉 2 张手牌，然后抽 2 张牌。
card.s-0002.name: 占位 N 特殊牌 2
card.s-0002.text: 清除双方所有的行效果。
card.s-0003.name: 占位 N 特殊牌 3
card.s-0003.text: 消灭战场上战力最高的单位，并列时随机选择一个。
card.s-0004.name: 占位 N 特殊牌 4
card.s-0004.text: 放逐任意一方的一个被锁定的单位。
card.s-1001.name: 占位 A 特殊牌 1
card.s-1001.text: 为己方近战行添加行效果：你的每个回合开始时，随机使该行 2 个单位各获得 1 点增益。
card.s-1002.name: 占位 A 特殊牌 2
card.s-1002.text: 移除己方单位的中毒、流血和锁定，然后清除己方各行的有害行效果。
card.s-1003.name: 占位 A 特殊牌 3
card.s-1003.text: 使一个己方单位的基础战力 +3。
card.s-2001.name: 占位 B 特殊牌 1
card.s-2001.text: 为对手的近战行添加行效果：对手的每个回合开始时，对该行战力最低的单位造成 2 点伤害。
card.s-2002.name: 占位 B 特殊牌 2
card.s-2002.text: 为对手的远程行添加行效果：对手的每个回合开始时，随机对该行 3 个单位各造成 1 点伤害。
card.s-2003.name: 占位 B 特殊牌 3
card.s-2003.text: 为对手的两行添加行效果：进入该行的每个单位受到 2 点伤害。
card.s-2004.name: 占位 B 特殊牌 4
card.s-2004.text: 为对手的远程行添加行效果：对手的每个回合开始时，对该行战力最高的单位造成 2 点伤害。
