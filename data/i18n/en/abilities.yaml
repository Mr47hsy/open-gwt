# Card text templates (docs/protocol/i18n.md §10). The compiler builds `card.<id>.text` from these
# for every card that has no explicit text in this locale; an explicit text always wins.
# A sentence is rendered from its action's template; the phrases it is made of — `{target}`,
# `{rows}`, `{cards}`, `{from}`, `{place}`, `{filter}` — are rendered first from the keys below
# and inserted as they are. `{count}` is always the number the sentence counts, so plural
# variants follow it. Every key must exist in every locale (plural variants aside).

# --- joining phrases and sentences
ability.join.sentences: "{a} {b}"
ability.join.list: "{a}, {b}"
ability.join.or: "{a} or {b}"
ability.join.and: "{a} and {b}"
ability.if.and: "{a} and {b}"

# --- the card itself, before its abilities
ability.card.row-only.melee: Melee row only.
ability.card.row-only.ranged: Ranged row only.
ability.card.stratagem-row.melee: Starts on the melee row.
ability.card.stratagem-row.ranged: Starts on the ranged row.
ability.card.opponent-side: Lands on the opponent's side.
ability.card.armor: "Armour {count}."
ability.card.provision-bonus: "Adds {count} to the provision budget."
ability.card.status.shielded: Enters the board with a shield.
ability.card.status.immune: "Immune: never offered as a choice."
ability.card.status.banish-on-leave: Banished whenever it leaves the board.
ability.card.status.kept-at-round-end: Stays on the board when a round ends, once.
ability.card.status.status-proof: No status can be added to it.
ability.card.status.guarding: "Guards its row: the opponent cannot choose any other card there."

# --- activated abilities: {count} is the charges, or the cooldown when charges are unlimited
ability.activate.charges.one: "Activate once: {effect}"
ability.activate.charges.other: "Activate, {count} charges: {effect}"
ability.activate.cooldown.one: "Activate once per turn: {effect}"
ability.activate.cooldown.other: "Activate every {count} turns: {effect}"
ability.activate.charges-cooldown.one: "Activate once: {effect}"
ability.activate.charges-cooldown.other: "Activate, {count} charges, cooldown {cooldown}: {effect}"
ability.activate.ready-on-play: Its ability can be used on the turn it is played.

