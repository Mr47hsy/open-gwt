# Server error messages — rendered on the server as the fallback `message` (docs/protocol/i18n.md §8).
error.unauthorised: Sign in to do that.
error.invalid-request: The request is not valid.
error.locale-unsupported: The locale {locale} is not supported.
error.deck-not-found: Deck {deck} was not found.
error.deck-illegal: This deck is not legal.
error.match-not-found: That match does not exist.
error.match-not-started: The match has not started yet.
error.match-not-finished: The match is still being played.
error.match-over: The match is over.
error.not-a-player: You are not a player in this match.
error.room-not-found: No room has that code.
error.room-full: That room already has two players.
error.own-room: You cannot join your own room.
error.room-code-exhausted: Could not allocate a room code; try again.
error.illegal-intent: That move is not allowed right now.
error.not-your-turn: It is not your turn.
error.choice-pending: Make your pending choice first.
error.unknown-instance: That card is not available.
error.unknown-message: Unknown message type {type}.
error.rate-limited: Too many moves at once.

# Deck-building rules a deck breaks — details.problems of deck_illegal (docs/protocol/cards.md §12).
error.deck.unknown-card: "There is no card {card}."
error.deck.leader-not-leader: "{card} is not a leader."
error.deck.stratagem-not-stratagem: "{card} is not a stratagem."
error.deck.wrong-faction: "{card} belongs to another faction."
error.deck.leader-in-deck: "{card} is a leader, not a card for the deck."
error.deck.stratagem-in-deck: "{card} is a stratagem, not a card for the deck."
error.deck.token-in-deck: "{card} only appears during a match and cannot be put in a deck."
error.deck.too-few-cards.one: "The deck has {count} card; it needs at least {min}."
error.deck.too-few-cards.other: "The deck has {count} cards; it needs at least {min}."
error.deck.too-many-cards.one: "The deck has {count} card; it may have at most {max}."
error.deck.too-many-cards.other: "The deck has {count} cards; it may have at most {max}."
error.deck.too-few-units.one: "The deck has {count} unit; it needs at least {min}."
error.deck.too-few-units.other: "The deck has {count} units; it needs at least {min}."
error.deck.too-many-copies.one: "The deck has {count} copy of {card}; the limit is {limit}."
error.deck.too-many-copies.other: "The deck has {count} copies of {card}; the limit is {limit}."
error.deck.over-budget: "The deck costs {used} provisions; its budget is {budget}."
