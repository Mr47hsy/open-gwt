# Statuses and row effects (cards.md §9, §10): the words players see for the vocabulary.
status.locked.name: Locked
status.locked.text: Its abilities do nothing while it is locked.
status.shielded.name: Shielded
status.shielded.text: The next damage it would take is blocked; the shield is then gone.
status.immune.name: Immune
status.immune.text: Cannot be chosen as a target; effects that target nobody in particular still reach it.
status.poisoned.name: Poisoned
status.poisoned.text: Poisoned once more, it is destroyed.
status.bleeding.name: Bleeding
status.bleeding.text: At the end of each of its controller's turns it takes 1 damage that armour does not absorb.
status.growing.name: Growing
status.growing.text: At the end of each of its controller's turns it is boosted by 1.
status.banish-on-leave.name: Banished on leaving
status.banish-on-leave.text: When it leaves the board it is banished instead of going anywhere else.
status.kept-at-round-end.name: Kept at round end
status.kept-at-round-end.text: It stays on the board when the round ends, once.
status.status-proof.name: Status-proof
status.status-proof.text: No status can be added to it.
status.guarding.name: Guarding
status.guarding.text: While it stands on a row, the opponent cannot choose any other card on that row.
status.on-enemy-side.name: On the enemy side
status.on-enemy-side.text: It stands on the side of the player who does not own it.
row-effect.damage-strongest.name: Strongest takes damage
row-effect.damage-strongest.text: "At the start of each of this player's turns, the strongest unit on this row takes {amount} damage."
row-effect.damage-weakest.name: Weakest takes damage
row-effect.damage-weakest.text: "At the start of each of this player's turns, the weakest unit on this row takes {amount} damage."
row-effect.damage-random.name: Random damage
row-effect.damage-random.text.one: "At the start of each of this player's turns, {count} random unit on this row takes {amount} damage."
row-effect.damage-random.text.other: "At the start of each of this player's turns, {count} random units on this row take {amount} damage."
row-effect.boost-random.name: Random boost
row-effect.boost-random.text.one: "At the start of each of this player's turns, {count} random unit on this row is boosted by {amount}."
row-effect.boost-random.text.other: "At the start of each of this player's turns, {count} random units on this row are boosted by {amount}."
row-effect.damage-on-arrival.name: Damage on arrival
row-effect.damage-on-arrival.text: "A unit entering this row takes {amount} damage."

