# Шаблоны текста карт (docs/protocol/i18n.md §10). Если у карты нет явного текста на этом языке,
# компилятор собирает `card.<id>.text` из этих шаблонов; явный текст всегда важнее. Каждая
# способность даёт одно предложение по шаблону своего действия; его части — `{target}`, `{rows}`,
# `{cards}`, `{from}`, `{place}`, `{filter}` — сначала рендерятся из ключей ниже и вставляются
# как есть. `{count}` — всегда то число, с которым согласуется предложение.
# Цель действия стоит в винительном падеже (`ability.target.…`); получатель урона, брони,
# базовой силы, щита и иммунитета — в дательном (`ability.target-to.…`).

