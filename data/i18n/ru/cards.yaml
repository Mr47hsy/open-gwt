card.a-1001.name: 'Заглушка A: артефакт 1'
card.a-1001.text: Артефакт, дальний ряд. Пока он на поле, отряды его ряда получают +1 к силе.
card.a-2001.name: 'Заглушка B: артефакт 1'
card.a-2001.text: Артефакт, ближний ряд. Не может быть выбран целью. В конце раунда наносит 2 урона случайному вражескому отряду.
card.g-0001.name: 'Заглушка N: стратагема 1'
card.g-0001.text: 'Стратагема. Если вы ходите первым, начинает на вашем поле. Один раз: усиливает ваш отряд на 3.'
card.g-0002.name: 'Заглушка N: стратагема 2'
card.g-0002.text: 'Стратагема, дальний ряд. Если вы ходите первым, начинает на вашем поле. Один раз: рядом появляются две карты «Заглушка N: токен 1».'
card.g-0003.name: 'Заглушка N: стратагема 3'
card.g-0003.text: 'Стратагема. Если вы ходите первым, начинает на вашем поле. Один раз: возьмите карту.'
card.l-1001.name: 'Заглушка A: лидер 1'
card.l-1001.text: 'Лидер. +15 к бюджету. Два заряда: усиливает ваш отряд на 2.'
card.l-2001.name: 'Заглушка B: лидер 1'
card.l-2001.text: 'Лидер. +15 к бюджету. Один заряд: наносит 3 урона вражескому отряду.'
card.s-0001.name: 'Заглушка N: особая карта 1'
card.s-0001.text: Сбросьте 2 случайные карты из руки, затем возьмите 2 карты.
card.s-0002.name: 'Заглушка N: особая карта 2'
card.s-0002.text: Снимает все эффекты рядов с обеих сторон.
card.s-0003.name: 'Заглушка N: особая карта 3'
card.s-0003.text: Уничтожает сильнейший отряд на поле; при равенстве выбирается случайный.
card.s-0004.name: 'Заглушка N: особая карта 4'
card.s-0004.text: Изгоняет заблокированный отряд любой стороны.
card.s-1001.name: 'Заглушка A: особая карта 1'
card.s-1001.text: 'Ваш ближний ряд получает эффект: в начале каждого вашего хода усиливает на 1 два случайных отряда в нём.'
card.s-1002.name: 'Заглушка A: особая карта 2'
card.s-1002.text: Снимает яд, кровотечение и блокировку с ваших отрядов, затем убирает вредные эффекты с ваших рядов.
card.s-1003.name: 'Заглушка A: особая карта 3'
card.s-1003.text: Повышает базовую силу вашего отряда на 3.
card.s-2001.name: 'Заглушка B: особая карта 1'
card.s-2001.text: 'Ближний ряд противника получает эффект: в начале каждого его хода наносит 2 урона слабейшему отряду в нём.'
card.s-2002.name: 'Заглушка B: особая карта 2'
card.s-2002.text: 'Дальний ряд противника получает эффект: в начале каждого его хода наносит 1 урон трём случайным отрядам в нём.'
card.s-2003.name: 'Заглушка B: особая карта 3'
card.s-2003.text: 'Оба ряда противника получают эффект: каждый входящий в них отряд получает 2 урона.'
card.s-2004.name: 'Заглушка B: особая карта 4'
card.s-2004.text: 'Дальний ряд противника получает эффект: в начале каждого его хода наносит 2 урона сильнейшему отряду в нём.'
card.t-0001.name: 'Заглушка N: токен 1'
card.t-0001.text: Токен, сила 2.
card.t-2001.name: 'Заглушка B: токен 1'
card.t-2001.text: Токен, сила 1.
card.u-0001.name: 'Заглушка N: отряд 1'
card.u-0001.text: Отряд, сила 6.
card.u-0002.name: 'Заглушка N: отряд 2'
card.u-0002.text: Отряд, сила 5, броня 1. На него нельзя наложить статус.
card.u-0003.name: 'Заглушка N: отряд 3'
card.u-0003.text: Отряд, сила 9. Изгоняется, когда покидает поле.
card.u-0004.name: 'Заглушка N: отряд 4'
card.u-0004.text: 'Отряд, сила 4. При розыгрыше: возвращает усиленный отряд любой стороны к базовой силе.'
card.u-0005.name: 'Заглушка N: отряд 5'
card.u-0005.text: 'Отряд, сила 4. При розыгрыше: наносит 2 урона каждому отряду противника на вашей стороне.'
card.u-1001.name: 'Заглушка A: отряд 1'
card.u-1001.text: Отряд, сила 5.
card.u-1002.name: 'Заглушка A: отряд 2'
card.u-1002.text: Отряд, сила 4, броня 2.
card.u-1003.name: 'Заглушка A: отряд 3'
card.u-1003.text: 'Отряд, сила 3. При розыгрыше: все остальные копии этой карты выходят из колоды на поле.'
card.u-1004.name: 'Заглушка A: отряд 4'
card.u-1004.text: 'Отряд, сила 4. При розыгрыше: усиливает на 1 ваши другие отряды с меткой «Заглушка: метка A».'
card.u-1005.name: 'Заглушка A: отряд 5'
card.u-1005.text: Отряд, сила 3. Пока он на поле, другие отряды его ряда получают +1 к силе.
card.u-1006.name: 'Заглушка A: отряд 6'
card.u-1006.text: Отряд, сила 4. Пока он на поле, соседние отряды получают +1 к силе.
card.u-1007.name: 'Заглушка A: отряд 7'
card.u-1007.text: Отряд, сила 5. При розыгрыше в ближний ряд получает 2 брони, в дальний — наносит 1 урон двум случайным вражеским отрядам.
card.u-1008.name: 'Заглушка A: отряд 8'
card.u-1008.text: 'Отряд, сила 3. При розыгрыше: в конце каждого вашего хода в течение 3 ходов усиливается на 1.'
card.u-1009.name: 'Заглушка A: отряд 9'
card.u-1009.text: 'Отряд, сила 4. При розыгрыше: повышает базовую силу вашего отряда на 1.'
card.u-1010.name: 'Заглушка A: отряд 10'
card.u-1010.text: 'Отряд, сила 4. При розыгрыше: исцеляет ваши раненые отряды.'
card.u-1011.name: 'Заглушка A: отряд 11'
card.u-1011.text: Отряд, сила 3. Остаётся на поле в конце раунда. В конце раунда усиливается на 2.
card.u-1012.name: 'Заглушка A: отряд 12'
card.u-1012.text: 'Отряд, сила 4. При розыгрыше: даёт щит вашему отряду без щита.'
card.u-1013.name: 'Заглушка A: отряд 13'
card.u-1013.text: 'Отряд, сила 7, броня 3. Охраняет свой ряд: противник не может выбирать другие отряды этого ряда.'
card.u-1014.name: 'Заглушка A: отряд 14'
card.u-1014.text: 'Отряд, сила 5. При розыгрыше: наносит 3 урона вражескому отряду и усиливается на прошедший урон.'
card.u-1015.name: 'Заглушка A: отряд 15'
card.u-1015.text: 'Отряд, сила 5. При розыгрыше: если в руке не больше 3 карт, усиливается на 4.'
card.u-1016.name: 'Заглушка A: отряд 16'
card.u-1016.text: 'Отряд, сила 4. При розыгрыше: если в вашей начальной колоде нет нейтральных карт, усиливается на 2.'
card.u-2001.name: 'Заглушка B: отряд 1'
card.u-2001.text: Отряд, сила 5.
card.u-2002.name: 'Заглушка B: отряд 2'
card.u-2002.text: 'Отряд, сила 4. При розыгрыше: наносит 2 урона вражескому отряду.'
card.u-2003.name: 'Заглушка B: отряд 3'
card.u-2003.text: 'Отряд, сила 3. При розыгрыше: вражеский отряд кровоточит 3 хода — 1 урон в конце каждого хода контролирующего его игрока.'
card.u-2004.name: 'Заглушка B: отряд 4'
card.u-2004.text: 'Отряд, сила 4. При розыгрыше: отравляет вражеский отряд; отравленный дважды отряд уничтожается.'
card.u-2005.name: 'Заглушка B: отряд 5'
card.u-2005.text: 'Отряд, сила 7. Выходит на сторону противника. При розыгрыше: возьмите карту.'
card.u-2006.name: 'Заглушка B: отряд 6'
card.u-2006.text: 'Отряд, сила 4. При розыгрыше: наносит 1 урон каждому кровоточащему вражескому отряду.'
card.u-2007.name: 'Заглушка B: отряд 7'
card.u-2007.text: 'Отряд, сила 3. При розыгрыше: блокирует вражеский отряд или артефакт.'
card.u-2008.name: 'Заглушка B: отряд 8'
card.u-2008.text: 'Отряд, сила 5. При розыгрыше: если ранены хотя бы два вражеских отряда, наносит 3 урона сильнейшему вражескому отряду.'
card.u-2009.name: 'Заглушка B: отряд 9'
card.u-2009.text: 'Отряд, сила 3. При розыгрыше: рядом появляются две карты «Заглушка B: токен 1».'
card.u-2010.name: 'Заглушка B: отряд 10'
card.u-2010.text: 'Отряд, сила 3. При розыгрыше: уничтожает ваш отряд с меткой «Заглушка: метка B» и усиливается на его силу.'
card.u-2011.name: 'Заглушка B: отряд 11'
card.u-2011.text: 'Отряд, сила 4. При розыгрыше: перемещает вражеский отряд в другой ряд.'
card.u-2012.name: 'Заглушка B: отряд 12'
card.u-2012.text: 'Отряд, сила 7. Не может быть выбран целью. При розыгрыше: уничтожает сильнейший вражеский отряд с силой 8 или больше.'
card.u-2013.name: 'Заглушка B: отряд 13'
card.u-2013.text: 'Отряд, сила 6. При розыгрыше: бьётся с вражеским отрядом — они по очереди наносят друг другу урон, равный своей силе, начиная с этого.'
card.u-2014.name: 'Заглушка B: отряд 14'
card.u-2014.text: 'Отряд, сила 4. При розыгрыше: забирает под свой контроль вражеский отряд с силой 4 или меньше.'
card.u-2015.name: 'Заглушка B: отряд 15'
card.u-2015.text: Отряд, сила 5. В конце раунда, если он ранен, исцеляется.
