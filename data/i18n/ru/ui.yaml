row-effect.damage-random.text.other: "В начале каждого хода этого игрока {count} случайных отрядов ряда получают {amount} урона."
row-effect.boost-random.name: Случайное усиление
row-effect.boost-random.text.one: "В начале каждого хода этого игрока {count} случайный отряд ряда усиливается на {amount}."
