# Статусы и эффекты ряда (cards.md §9, §10): слова, которые видят игроки.
status.locked.name: Заблокирован
status.locked.text: Пока карта заблокирована, её способности не действуют.
status.shielded.name: Под щитом
status.shielded.text: Следующий урон будет заблокирован; после этого щит исчезает.
status.immune.name: Иммунитет
status.immune.text: Нельзя выбрать целью; эффекты, не выбирающие цель, всё равно действуют.
status.poisoned.name: Отравлен
status.poisoned.text: При повторном отравлении отряд уничтожается.
status.bleeding.name: Кровотечение
status.bleeding.text: В конце каждого хода своего владельца отряд получает 1 урона, который броня не поглощает.
status.growing.name: Рост
status.growing.text: В конце каждого хода своего владельца отряд усиливается на 1.
status.banish-on-leave.name: Изгоняется при уходе
status.banish-on-leave.text: Покидая поле, карта изгоняется, а не отправляется куда-либо ещё.
status.kept-at-round-end.name: Остаётся в конце раунда
status.kept-at-round-end.text: Остаётся на поле в конце раунда, один раз.
status.status-proof.name: Защита от статусов
status.status-proof.text: На карту нельзя наложить ни один статус.
status.guarding.name: Охрана
status.guarding.text: Пока отряд стоит в ряду, соперник не может выбрать другую карту этого ряда.
status.on-enemy-side.name: На стороне противника
status.on-enemy-side.text: Карта стоит на стороне игрока, которому не принадлежит.
row-effect.damage-strongest.name: Урон сильнейшему
row-effect.damage-strongest.text: "В начале каждого хода этого игрока сильнейший отряд ряда получает {amount} урона."
row-effect.damage-weakest.name: Урон слабейшему
row-effect.damage-weakest.text: "В начале каждого хода этого игрока слабейший отряд ряда получает {amount} урона."
row-effect.damage-random.name: Случайный урон
row-effect.damage-random.text.one: "В начале каждого хода этого игрока {count} случайный отряд ряда получает {amount} урона."
row-effect.damage-random.text.few: "В начале каждого хода этого игрока {count} случайных отряда ряда получают {amount} урона."
