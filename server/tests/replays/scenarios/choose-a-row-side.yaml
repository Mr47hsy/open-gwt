# row_target.pick: chosen (cards.md §7.2): the player picks one row-side of the side — every
# row is offered, empty or not (a choice of kind row).
cards:
  mire:
    kind: special
    color: bronze
    provisions: 5
    abilities:
      - when: on_play
        do: set_row_effect
        effect: damage_weakest
        amount: 2
        row_target: {pick: chosen, side: opponent}
seed: 2
decks:
  - [mire, spare, spare]
  - [plain5, plain3, spare]
steps:
  - [0, play, spare, melee]
  - [0, end]
  - [1, play, plain5, melee]
  - [1, end]
  - [0, play, mire]
  - [0, choose, "opponent:ranged"]
  - [0, end]
  - [1, play, plain3, ranged]
  - [1, end]
  - [0, play, spare, melee]
  - [0, end]                    # seat 1's turn start: only the ranged row suffers
events:
  - {type: choice_requested, seat: 0, kind: row, prompt_key: choice.set-row-effect, option_count: 2}
  - {type: row_effect_set, seat: 1, row: ranged, effect: damage_weakest, amount: 2}
  - {type: turn_started, seat: 1}
  - {type: unit_damaged, card: plain3, reason: damage_weakest, amount: 2}
absent:
  - {type: unit_damaged, card: plain5}
