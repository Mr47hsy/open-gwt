# on_destroyed with summon_from_deck (cards.md §8): the next copy comes from the deck onto the
# row the destroyed card was last on; if.on_row reads that row too.
cards:
  echo:
    kind: unit
    color: bronze
    provisions: 4
    power: 1
    abilities:
      - when: on_destroyed
        if: {on_row: ranged}
        do: summon_from_deck
        cards: {pick: first, where: {same_id_as_this: true}}
rules:
  draws_per_round: [2]
seed: 1
decks:
  - [echo, echo, echo]
  - [zap2, zap2]
steps:
  - [0, play, echo, ranged]
  - [0, end]
  - [1, play, zap2, melee]
  - [1, choose, echo]
  - [1, end]
events:
  - {type: card_destroyed, card: echo, row: ranged}
  - {type: card_summoned, card: echo, from: deck, row: ranged, position: 0}
board:
  0: {ranged: ["echo:1"]}
hand:
  0: [echo]
