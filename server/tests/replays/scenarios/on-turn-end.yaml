# on_turn_end (cards.md §6.1, §11.4): at each of its controller's turn ends, once the statuses
# of that player's cards have acted, the card's abilities resolve.
cards:
  sniper:
    kind: unit
    color: bronze
    provisions: 4
    power: 4
    abilities:
      - {when: on_turn_end, do: damage, amount: 1, target: {units: all, side: opponent}}
seed: 1
decks:
  - [sniper, plain5, plain5, spare]
  - [plain5, bleed2, plain5, spare]
steps:
  - [0, play, sniper, melee]
  - [0, end]                    # no enemy yet
  - [1, play, plain5, melee]
  - [1, end]                    # seat 1's turn end: the sniper is not theirs
  - [0, play, plain5, melee]
  - [0, end]                    # 5 -> 4
  - [1, play, bleed2]
  - [1, choose, sniper]
  - [1, end]
  - [0, play, plain5, melee]
  - [0, end]                    # bleeding first (4 -> 3), then the sniper (4 -> 3)
events:
  - {type: card_played, seat: 0, card: plain5}
  - {type: unit_damaged, seat: 1, card: plain5, amount: 1, power: 4, source: sniper}
  - {type: turn_ended, seat: 0}
  - {type: unit_damaged, seat: 0, card: sniper, reason: bleeding, power: 3}
  - {type: unit_damaged, seat: 1, card: plain5, amount: 1, power: 3, source: sniper}
  - {type: turn_ended, seat: 0}
board:
  1: {melee: ["plain5:3"]}
