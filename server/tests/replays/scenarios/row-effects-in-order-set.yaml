# Several row effects on one player's rows act in the order they were set (cards.md §10,
# §11.4), not in row order — per the standalone game's community rules page.
cards:
  haze:
    kind: special
    color: bronze
    provisions: 4
    abilities:
      - when: on_play
        do: set_row_effect
        effect: damage_strongest
        amount: 1
        row_target: {pick: all, side: opponent, rows: [ranged]}
seed: 1
decks:
  - [plain8, plain5, spare, spare]
  - [haze, frost, spare, spare]
steps:
  - [0, play, plain8, ranged]
  - [0, end]
  - [1, play, haze]
  - [1, end]                    # the ranged row's effect first
  - [0, play, plain5, melee]
  - [0, end]
  - [1, play, frost]
  - [1, end]                    # then the melee row's
events:
  - {type: row_effect_set, seat: 0, row: ranged}
  - {type: row_effect_set, seat: 0, row: melee}
  - {type: turn_started, seat: 0}
  - {type: unit_damaged, card: plain8, reason: damage_strongest}
  - {type: unit_damaged, card: plain5, reason: damage_weakest}
board:
  0: {melee: ["plain5:3"], ranged: ["plain8:6"]}
