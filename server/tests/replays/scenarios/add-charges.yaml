# add_charges (cards.md §8): the acting card's own activated ability, or the acting player's
# leader's, gains charges; an artifact's activated ability works like a unit's (§3).
cards:
  well:
    kind: artifact
    color: bronze
    provisions: 5
    activation: {charges: 1}
    abilities:
      - {when: on_activate, do: boost, amount: 1, target: {units: chosen, side: self}}
      - {when: on_turn_end, do: add_charges, to: this, amount: 1}
  rally:
    kind: special
    color: bronze
    provisions: 4
    abilities:
      - {when: on_play, do: add_charges, to: leader, amount: 1}
seed: 1
decks:
  - [well, plain5, rally, spare]
  - [spare, spare, spare, spare]
steps:
  - [0, play, well, ranged]
  - [0, end]                    # its turn end: 1 -> 2 charges
  - [1, play, spare, melee]
  - [1, end]
  - [0, play, plain5, melee]
  - [0, order, well]
  - [0, choose, plain5]
  - [0, end]
  - [1, play, spare, melee]
  - [1, end]
  - [0, play, rally]
  - [0, end]
events:
  - {type: charges_changed, card: well, from: 1, to: 2, source: well}
  - {type: order_used, card: well, charges: 1}
  - {type: unit_boosted, card: plain5, source: well}
  - {type: charges_changed, card: well, from: 1, to: 2, source: well}
  - {type: charges_changed, card: leader, from: 1, to: 2, source: rally}
board:
  0: {melee: ["plain5:6"], ranged: [well]}
