[project]
name = "opengwt"
version = "0.1.0"
description = "open-gwt rules core, card data tools, bots, simulator and server"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10.15"
dependencies = [
    "pyyaml>=6.0.2",
    "jsonschema>=4.23",
]

[project.scripts]
opengwt-sim = "opengwt.sim.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
    "types-PyYAML",
    "types-jsonschema",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opengwt"]

[tool.uv]
required-version = ">=0.12.5"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
packages = ["opengwt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.importlinter]
root_package = "opengwt"

[[tool.importlinter.contracts]]
name = "Layers: sim > bots > data > core"
type = "layers"
layers = ["opengwt.sim", "opengwt.bots", "opengwt.data", "opengwt.core"]
