[project]
name = "opengwt"
version = "0.1.0"
description = "open-gwt rules core, card data tools, bots, simulator and server"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10.15"
dependencies = [
    "pyyaml>=6.0.2",
    "jsonschema>=4.23",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "pyjwt>=2.9",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30"]
mysql = ["asyncmy>=0.2.9"]
redis = ["redis>=5.2"]

[project.scripts]
opengwt-sim = "opengwt.sim.cli:main"
opengwt-server = "opengwt.server.cli:main"
opengwt-data = "opengwt.data.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
    "types-PyYAML",
    "types-jsonschema",
    "httpx>=0.27",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opengwt"]

[tool.uv]
required-version = ">=0.12.5"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# FastAPI declares dependencies as argument defaults; that is the framework idiom, not a bug.
"src/opengwt/server/routers/*" = ["B008"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
packages = ["opengwt"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncmy", "aiosqlite"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.importlinter]
root_package = "opengwt"

[[tool.importlinter.contracts]]
name = "Layers: server > sim > bots > data > i18n > core"
type = "layers"
layers = ["opengwt.server", "opengwt.sim", "opengwt.bots", "opengwt.data", "opengwt.i18n", "opengwt.core"]
