# Card set draft-d, assembled from .drafts/draft-d/drafts/01.yaml and 02.yaml (zh-CN designs in
# .drafts/draft-d/batches/). A proposal for the owner, not content: read gaps.md before importing.
# A phrase the vocabulary cannot express is left out and reported as a gap, never approximated.
schema: opengwt.cardset/1
set: draft-d
factions:
  # The designs give this faction no name; the import stubs it (TODO(i18n)).
  draft-d: {}
cards:
  # --- batch 01 ---

  # 打出时：对一个敌方单位造成 3 点伤害。
  - key: dr-scout
    faction: draft-d
    kind: unit
    color: bronze
    provisions: 4
    power: 3
    name: { zh-CN: 草稿斥候, en: Draft scout }
    abilities:
      - when: on_play
        do: damage
        amount: 3
        target: { units: chosen, side: opponent }

  # 打出时：治疗所有受伤的友方单位。
  - key: dr-medic
    faction: draft-d
    kind: unit
    color: bronze
    provisions: 5
    power: 4
    name: { zh-CN: 草稿医师, en: Draft medic }
    abilities:
      - when: on_play
        do: heal
        target: { units: all, side: self, where: { damaged: true } }

  # 在场时，相邻的单位战力 +1。
  - key: dr-drummer
    faction: draft-d
    kind: unit
    color: bronze
    provisions: 5
    power: 3
    name: { zh-CN: 草稿鼓手, en: Draft drummer }
    abilities:
      - when: while_on_board
        do: continuous_boost
        amount: 1
        scope: adjacent

  # 免疫。只能放在近战行。你的每个回合开始时，使自身获得 1 点增益。
  - key: dr-sentry
    faction: draft-d
    kind: unit
    color: gold
    provisions: 9
    power: 6
    armor: 2
    rows: [melee]
    statuses: [immune]
    name: { zh-CN: 草稿哨兵, en: Draft sentry }
    abilities:
      - when: on_turn_start
        do: boost
        amount: 1
        target: { units: this }

  # 锁定一个敌方单位，然后对同一单位造成 2 点伤害。
  - key: dr-trapper
    faction: draft-d
    kind: special
    color: bronze
    provisions: 5
    name: { zh-CN: 草稿陷阱, en: Draft trap }
    abilities:
      - when: on_play
        do: add_status
        status: locked
        target: { units: chosen, side: opponent }
      - when: on_play
        do: damage
        amount: 2
        target: { units: previous_targets }

  # 从你的牌库中打出一张战力不高于 4 的铜色单位。
  - key: dr-rally
    faction: draft-d
    kind: special
    color: bronze
    provisions: 4
    name: { zh-CN: 草稿集结, en: Draft rally }
    abilities:
      - when: on_play
        do: play_from_deck
        cards:
          pick: chosen
          side: self
          where: { kind: [unit], color: bronze, power_at_most: 4 }

  # 打出时：在此牌旁边放置两张“草稿新兵”。
  - key: dr-herald
    faction: draft-d
    kind: unit
    color: bronze
    provisions: 5
    power: 2
    name: { zh-CN: 草稿传令官, en: Draft herald }
    abilities:
      - when: on_play
        do: place_new_card
        card: dr-recruit
        count: 2

  # --- batch 02 ---

  # 衍生卡，不会出现在卡组中。
  - key: dr-recruit
    faction: draft-d
    kind: unit
    token: true
    power: 1
    name: { zh-CN: 草稿新兵, en: Draft recruit }

  # 当此单位的战力第一次达到 8 或更高时，抽一张牌。
  # Unmapped (gaps on_power_reached, once_per_match): the card keeps only its stats.
  - key: dr-alchemist
    faction: draft-d
    kind: unit
    color: bronze
    provisions: 5
    power: 3
    name: { zh-CN: 草稿炼金师, en: Draft alchemist }

  # 打出时：把一个敌方单位变成一张“草稿新兵”，保留其所在位置。
  # Unmapped (gap transform_in_place): the card keeps only its stats.
  - key: dr-shifter
    faction: draft-d
    kind: unit
    color: gold
    provisions: 8
    power: 5
    name: { zh-CN: 草稿易形者, en: Draft shifter }

  # 构筑预算 +15。主动能力，共 2 次：使一个友方单位获得 3 点增益。
  - key: dr-captain
    faction: draft-d
    kind: leader
    provision_bonus: 15
    activation: { charges: 2 }
    abilities:
      - when: on_activate
        do: boost
        amount: 3
        target: { units: chosen, side: self }
    name: { zh-CN: 草稿队长, en: Draft captain }

  # 使用一次：抽一张牌。
  - key: dr-gambit
    faction: draft-d
    kind: stratagem
    activation: { charges: 1 }
    abilities:
      - when: on_activate
        do: draw
        count: 1
    name: { zh-CN: 草稿先手计, en: Draft gambit }

  # 打出时：从你的手牌中选择一张牌展示给对手，然后把它放到你牌库的底部。
  # Unmapped (gaps hand_card_to_deck_bottom, reveal_to_opponent): the card keeps only its stats.
  - key: dr-scholar
    faction: draft-d
    kind: unit
    color: bronze
    provisions: 4
    power: 3
    name: { zh-CN: 草稿学者, en: Draft scholar }
