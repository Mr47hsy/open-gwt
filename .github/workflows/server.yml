name: server

on:
  push:
    branches: [develop, release]
    paths: ["server/**", "data/**", "docs/protocol/*.json", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", "data/**", "docs/protocol/*.json", ".github/workflows/server.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ">=0.12.5"
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --python ${{ matrix.python }} --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run pytest -q
      - run: uv run opengwt-sim --matches 300 --replay-check 30 --data ../data
