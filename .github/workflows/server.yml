name: server

on:
  push:
    branches: [develop, release]
    paths: ["server/**", "data/**", "docs/protocol/*.json", "docs/protocol/examples/**", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", "data/**", "docs/protocol/*.json", "docs/protocol/examples/**", ".github/workflows/server.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: opengwt
          POSTGRES_PASSWORD: opengwt
          POSTGRES_DB: opengwt
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U opengwt" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      OPENGWT_TEST_POSTGRES_URL: postgresql+asyncpg://opengwt:opengwt@localhost:5432/opengwt
      # Every uv command must use the matrix interpreter; without this, `uv run` reads the
      # repository's .python-version (3.10), rebuilds the environment on that version and drops
      # the extras that `uv sync` installed.
      UV_PYTHON: ${{ matrix.python }}
      # The environment is synced once, explicitly, with the postgres extra; `uv run` must not
      # re-sync it afterwards.
      UV_NO_SYNC: "1"
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ">=0.12.5"
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --group dev --extra postgres
      - name: the environment really is the matrix interpreter with the postgres extra
        run: |
          uv run python -c "import sys, asyncpg; assert sys.version.startswith('${{ matrix.python }}.'), sys.version; print(sys.version, 'asyncpg', asyncpg.__version__)"
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run pytest -q
      - run: uv run opengwt-sim --matches 300 --replay-check 30 --data ../data
